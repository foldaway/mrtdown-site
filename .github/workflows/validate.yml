name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - production
      - overhaul

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/baosystems/postgis:17
        env:
          POSTGRES_DB: mrtdown_test
          POSTGRES_PASSWORD: postgres
          TZ: UTC
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d mrtdown_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        env:
          TEST_TIMETABLE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/mrtdown_test
        run: npm run verify
