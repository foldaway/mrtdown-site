name: Production deployment

on:
  workflow_call:
    inputs:
      sha:
        description: Full commit SHA to migrate and deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate-production:
    name: Migrate production database
    runs-on: ubuntu-latest
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: Check production still points to this release
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          production_sha="$(git ls-remote origin refs/heads/production | cut -f1)"
          if [ "$production_sha" != "$RELEASE_SHA" ]; then
            echo "Production moved to $production_sha; refusing stale release $RELEASE_SHA." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-production:
    name: Deploy production
    needs: migrate-production
    env:
      RELEASE_SHA: ${{ inputs.sha }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://www.mrtdown.org
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: Check production still points to this release
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          production_sha="$(git ls-remote origin refs/heads/production | cut -f1)"
          if [ "$production_sha" != "$RELEASE_SHA" ]; then
            echo "Production moved to $production_sha; refusing stale release $RELEASE_SHA." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - run: |-
          flyctl deploy \
            --config fly.production.toml \
            --local-only \
            --env "GIT_SHA=$RELEASE_SHA" \
            --env "MRTDOWN_COMBINED_RELEASE_INDEX=$MRTDOWN_COMBINED_RELEASE_INDEX" \
            --build-arg TIER=production \
            --build-arg SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --image-label="$RELEASE_SHA" \
            --build-arg SENTRY_ORG=${{ vars.SENTRY_ORG }} \
            --build-arg SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }} \
            --build-secret SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} \
            --build-arg "SENTRY_RELEASE=$RELEASE_SHA" \
            --build-arg VITE_CROWD_REPORT_TURNSTILE_SITE_KEY=${{ secrets.CROWD_REPORT_TURNSTILE_SITE_KEY }} \
            --build-arg VITE_PUBLIC_POSTHOG_KEY=${{ secrets.VITE_PUBLIC_POSTHOG_KEY }} \
            --build-arg VITE_PUBLIC_POSTHOG_HOST=${{ secrets.VITE_PUBLIC_POSTHOG_HOST }} \
            --build-arg VITE_ROOT_URL=https://www.mrtdown.org
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          MRTDOWN_COMBINED_RELEASE_INDEX: ${{ vars.MRTDOWN_COMBINED_RELEASE_INDEX }}

      - name: Sync production QStash schedules
        run: npm run qstash:schedules:sync
        env:
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          QSTASH_URL: ${{ secrets.QSTASH_URL }}
          TIER: production
          VITE_ROOT_URL: https://www.mrtdown.org
          PULL_WORKFLOW_URL: https://mrtdown-site.fly.dev/internal/api/workflows/pull
